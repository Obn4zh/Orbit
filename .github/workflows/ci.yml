name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows app + protocol tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test windows/Orbit.Core.Tests -c Release
      - name: Build Windows app
        run: dotnet build windows/Orbit.Windows -c Release

  android-tv:
    name: Android TV app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        working-directory: android-tv
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-tv-apk
          path: android-tv/app/build/outputs/apk/release/app-release.apk
